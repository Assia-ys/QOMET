name: Build macOS

on:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build backend (Mac binary)
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller app.py \
            --name qomet-server \
            --onefile \
            --console \
            --paths . \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import engineio.async_drivers.asgi \
            --hidden-import backend.main \
            --collect-all socketio \
            --collect-all engineio
          mkdir -p backend-dist
          cp dist/qomet-server backend-dist/qomet-server-mac
          chmod +x backend-dist/qomet-server-mac

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install root dependencies
        run: npm install

      - name: Install frontend dependencies
        run: cd frontend/src && npm install

      - name: Build Electron app (Mac)
        run: npm run build && npx electron-builder --mac --publish never

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: QOMET-mac
          path: dist/*.dmg
